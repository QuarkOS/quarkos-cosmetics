modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/QuarkOS/quarkos-cosmetics/issues"

[[mods]]
modId = "quarkos_cosmetics"
version = "${version}"
displayURL = "https://github.com/QuarkOS/quarkos-cosmetics"
displayName = "QuarkOS Cosmetics"
authors = "Emilio Schwaiger"
description = '''Free client cosmetics: hats, shoulders, idle wings, tails, and ears, plus an original 3D second skin. Local equip works offline.'''
logoFile = "assets/quarkos_cosmetics/icon.png"
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.quarkos_cosmetics]]
modId = "forge"
mandatory = true
versionRange = "[${forge_dep},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.quarkos_cosmetics]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft}]"
ordering = "NONE"
side = "CLIENT"

[[dependencies.quarkos_cosmetics]]
modId = "geckolib"
mandatory = true
versionRange = "[${geckolib},)"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config = "quarkos_cosmetics.mixins.json"
